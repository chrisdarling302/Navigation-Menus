<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="nav-four-style.css" />
    <title>Nav Four</title>
    <script
      src="https://kit.fontawesome.com/54f426de4c.js"
      crossorigin="anonymous"
    ></script>
    <script src="nav-four-index.js" defer></script>
  </head>
  <body>
    <section id="landing">
      <div class="row">
        <nav>
          <div class="row nav__row">
            <div class="nav__logo">
              <img
                class="nav__logo--img"
                src="./assets/logo.2c489fc453a1783cbadacf914efa3df6.svg"
                alt="logo"
              />
              <div class="nav__logo--title">Treact</div>
            </div>
            <ul class="nav__links">
              <li>
                <a href="#" class="nav__link">About</a>
              </li>
              <li>
                <a href="#" class="nav__link">Blog</a>
              </li>
              <li>
                <a href="#" class="nav__link">Pricing</a>
              </li>
              <li>
                <a href="#" class="nav__link">Contact Us</a>
              </li>
              <li>
                <a href="#" class="nav__link no-cursor">Login</a>
              </li>
              <li>
                <a href="#" class="nav__link nav__link--primary no-cursor"
                  >Sign Up</a
                >
              </li>
            </ul>
            <!-- Mobile Menu -->
            <button class="btn__menu" onclick="openMenu()">
              <i class="fas fa-bars"></i>
            </button>
            <div class="menu__backdrop">
              <button class="btn__menu--close" onclick="closeMenu()">
                <i class="fas fa-times"></i>
              </button>
              <ul class="menu__links">
                <li class="menu__list">
                  <a href="#" class="menu__link" onclick="closeMenu()">About</a>
                </li>
                <li class="menu__list">
                  <a href="#" class="menu__link" onclick="closeMenu()">Blog</a>
                </li>
                <li class="menu__list">
                  <a href="#" class="menu__link" onclick="closeMenu()"
                    >Pricing</a
                  >
                </li>
                <li class="menu__list">
                  <a href="#" class="menu__link" onclick="closeMenu()"
                    >Contact Us</a
                  >
                </li>
                <li class="menu__list">
                  <a href="#" class="menu__link no-cursor" onclick="closeMenu()"
                    >Login</a
                  >
                </li>
                <li class="menu__list">
                  <a
                    href="#"
                    class="menu__link nav__link--last no-cursor"
                    onclick="closeMenu()"
                    >Sign Up</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </section>
  </body>
</html>
